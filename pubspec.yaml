name: intravel
description: "InTravel - Inclusive Travel Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  flutter_tts: ^4.0.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  share_plus: ^10.0.3
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/intravel/
    - assets/intravel/assets/
    - assets/intravel/assets/home/
    - assets/intravel/vendor/leaflet/
    - assets/intravel/vendor/leaflet/images/
