name: intravel
description: "InTravel - Inclusive Travel Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  flutter_compass: ^0.8.1
  http: ^1.2.2
  flutter_tts: ^4.0.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  share_plus: ^10.0.3
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.4
  google_generative_ai: 0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/intravel/assets/new_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/intravel/
    - assets/intravel/assets/
    - assets/intravel/assets/home/
    - assets/intravel/vendor/leaflet/
    - assets/intravel/vendor/leaflet/images/
    # Bundled as a fallback so ORS_API_KEY and GEMINI_API_KEY load
    # automatically no matter how the app is launched (IDE Run button, hot
    # restart, a plain `flutter run` with no flags) — see
    # lib/services/routing_service.dart and
    # lib/services/gemini_api_key_loader.dart, which both read this asset
    # when no --dart-define was supplied.
    #
    # env.json itself stays gitignored; only this path declaration is
    # committed. Copy env.example.json to env.json and fill in your keys.
    # Without this line the asset fallback silently fails and both
    # routing and the assistant degrade to their offline behavior.
    - env.json
